name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: CPU smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\release\uuid-v7-bench.exe cpu --seconds 1 --threads 2 --seed 42 --timestamp-ms 1729280000000 --output cpu.json
          .\target\release\uuid-v7-bench.exe collision-stats --volumes 100,1000 --trials 2 --entropy-bits 12 --output stats.csv
      - name: CPU smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          ./target/release/uuid-v7-bench cpu --seconds 1 --threads 2 --seed 42 --timestamp-ms 1729280000000 --output cpu.json
          ./target/release/uuid-v7-bench collision-stats --volumes 100,1000 --trials 2 --entropy-bits 12 --output stats.csv
      - uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            cpu.json
            stats.csv
          if-no-files-found: error

  cuda:
    name: CUDA compile / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: Jimver/cuda-toolkit@v0.2.36
        if: runner.os == 'Linux'
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc","cudart","cudart-dev"]'
      - name: Install minimal NVIDIA CUDA 12.8 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-cuda-windows.ps1
      - name: Windows CUDA build / host parity vectors
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build-windows.ps1
          if (-not (Test-Path target/release/uuid-gpu.exe)) { throw "CUDA missing" }
          ./target/release/uuid-gpu.exe vectors
      - name: Linux CUDA build / host parity vectors
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./build-linux.sh
          test -f target/release/uuid-gpu
          ./target/release/uuid-gpu vectors
      - name: Package Windows x86_64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/uuid-v7-bench.exe dist/
          Copy-Item target/release/uuid-gpu.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath uuid-v7-benchmark-windows-x86_64.zip -Force
      - name: Package Linux x86_64
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/uuid-v7-bench target/release/uuid-gpu README.md dist/
          chmod +x dist/uuid-v7-bench dist/uuid-gpu
          tar -czf uuid-v7-benchmark-linux-x86_64.tar.gz -C dist .
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-x86_64
          path: |
            uuid-v7-benchmark-windows-x86_64.zip
            uuid-v7-benchmark-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Windows + Linux GitHub Release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [rust, cuda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Verify both archives
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/uuid-v7-benchmark-windows-x86_64.zip
          test -s artifacts/uuid-v7-benchmark-linux-x86_64.tar.gz
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: v0.2.${{ github.run_number }} (Windows + Linux)
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            artifacts/uuid-v7-benchmark-windows-x86_64.zip
            artifacts/uuid-v7-benchmark-linux-x86_64.tar.gz

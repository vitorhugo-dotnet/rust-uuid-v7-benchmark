name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc","cudart","cudart_dev"]'
      - name: Test and build Windows + CUDA
        shell: pwsh
        run: |
          cargo test --locked
          ./build-windows.ps1
          if (-not (Test-Path target/release/uuid-gpu.exe)) { throw "CUDA executable missing" }
          ./target/release/uuid-gpu.exe vectors
      - name: Package Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/uuid-v7-bench.exe dist/
          Copy-Item target/release/uuid-gpu.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath uuid-v7-benchmark-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: uuid-v7-benchmark-windows-x86_64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc","cudart","cudart-dev"]'
      - name: Test and build Linux + CUDA
        shell: bash
        run: |
          cargo test --locked
          bash ./build-linux.sh
          test -f target/release/uuid-gpu
          ./target/release/uuid-gpu vectors
      - name: Package Linux x86_64
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/uuid-v7-bench target/release/uuid-gpu README.md dist/
          chmod +x dist/uuid-v7-bench dist/uuid-gpu
          tar -czf uuid-v7-benchmark-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: uuid-v7-benchmark-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/uuid-v7-benchmark-windows-x86_64.zip
            artifacts/uuid-v7-benchmark-linux-x86_64.tar.gz
